<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ganimet</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link
  href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&display=swap"
  rel="stylesheet"
>

<style>

:root{
  --yellow:#FFD400;
  --yellow-dim:#B89A00;

  --bg-dark:#0A0A0A;
  --card-dark:#161616;
  --border-dark:#2A2A2A;

  --bg-light:#FAFAF7;
  --card-light:#FFFFFF;
  --border-light:#E4E1D6;

  --text-secondary-dark:#8A8A85;
  --text-secondary-light:#6B6B63;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:'Inter',sans-serif;
  background:var(--bg-dark);
  color:var(--yellow);
  min-height:100vh;
  transition:
    background .35s ease,
    color .35s ease;
}

body.light{
  background:var(--bg-light);
}

body.light .card{
  background:var(--card-light);
  border-color:var(--border-light);
}

body.light .price-old{
  color:var(--text-secondary-light);
}

body.light .platform-tag{
  background:#00000010;
  color:var(--text-secondary-light);
}

body.light header{
  border-bottom-color:var(--border-light);
}

body.light .footer-note{
  color:var(--text-secondary-light);
}

body.light .currency-note{
  color:var(--text-secondary-light);
}

body.light .status-msg{
  color:var(--text-secondary-light);
}


/* =========================
   HEADER
========================= */

header{
  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:18px 28px;

  border-bottom:1px solid var(--border-dark);

  position:sticky;
  top:0;
  z-index:20;

  background:inherit;

  backdrop-filter:blur(6px);
}

.logo-wrap{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo-icon{
  width:36px;
  height:36px;

  animation:
    coinFlip 3.2s ease-in-out infinite;

  filter:
    drop-shadow(
      0 0 7px rgba(255,212,0,.5)
    );

  transform-style:preserve-3d;
}

@keyframes coinFlip{

  0%,100%{
    transform:rotateY(0deg);
  }

  45%{
    transform:rotateY(360deg);
  }

  55%{
    transform:rotateY(360deg);
  }

}

.logo-text{
  font-family:'Archivo Black',sans-serif;

  font-size:26px;
  font-weight:900;

  letter-spacing:.5px;

  text-shadow:
    0 0 18px rgba(255,212,0,.35);

  background:
    linear-gradient(
      100deg,
      var(--yellow-dim) 30%,
      #FFFBE0 46%,
      var(--yellow) 52%,
      var(--yellow-dim) 70%
    );

  background-size:250% 100%;

  -webkit-background-clip:text;
  background-clip:text;

  -webkit-text-fill-color:transparent;

  animation:
    shine 3.2s ease-in-out infinite;
}

@keyframes shine{

  0%{
    background-position:200% 0;
  }

  45%,100%{
    background-position:-60% 0;
  }

}

.mode-toggle{
  display:flex;
  align-items:center;
  gap:8px;

  background:#00000030;

  border:1px solid var(--border-dark);

  border-radius:999px;

  padding:6px 14px;

  cursor:pointer;

  color:var(--yellow);

  font-size:13px;
  font-weight:600;

  transition:.2s;
}

body.light .mode-toggle{
  background:#00000008;
  border-color:var(--border-light);
}

.mode-toggle:hover{
  border-color:var(--yellow);
}


/* =========================
   MAIN
========================= */

main{
  padding:28px;
  max-width:1200px;
  margin:0 auto;
}

.status-msg{
  text-align:center;

  padding:40px 20px;

  color:var(--text-secondary-dark);

  font-size:14px;
}

.grid{
  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:16px;
}

@media (min-width:640px){

  .grid{
    grid-template-columns:
      repeat(3,1fr);
  }

}

@media (min-width:900px){

  .grid{
    grid-template-columns:
      repeat(4,1fr);
  }

}

@media (min-width:1180px){

  .grid{
    grid-template-columns:
      repeat(5,1fr);
  }

}


/* =========================
   CARD
========================= */

.card{
  background:var(--card-dark);

  border:1px solid var(--border-dark);

  border-radius:10px;

  overflow:hidden;

  position:relative;

  cursor:pointer;

  text-decoration:none;

  display:block;

  transition:
    transform .18s ease,
    border-color .18s ease;
}

.card:hover{
  transform:translateY(-4px);
  border-color:var(--yellow);
}

.card-img{
  width:100%;

  aspect-ratio:1/1;

  background:
    linear-gradient(
      135deg,
      #2b2b2b,
      #151515
    );

  display:flex;

  align-items:center;
  justify-content:center;

  color:#555;

  font-size:12px;

  position:relative;

  overflow:hidden;
}

.card-img img{
  width:100%;
  height:100%;

  object-fit:cover;

  display:block;
}

.discount-badge{
  position:absolute;

  top:8px;
  left:8px;

  background:var(--yellow);

  color:#111;

  font-weight:800;

  font-size:12px;

  padding:3px 8px;

  border-radius:5px;

  z-index:2;
}

.hover-info{
  position:absolute;

  inset:0;

  background:rgba(0,0,0,.78);

  color:#fff;

  display:flex;

  align-items:center;
  justify-content:center;

  text-align:center;

  font-size:12px;

  padding:10px;

  opacity:0;

  transition:
    opacity .18s ease;

  z-index:1;
}

.card:hover .hover-info{
  opacity:1;
}

.card-body{
  padding:10px 12px 14px;
}

.game-name{
  font-family:'Archivo Black',sans-serif;

  font-size:14px;

  color:var(--yellow);

  margin-bottom:7px;

  line-height:1.2;
}

.price-row{
  display:flex;

  align-items:baseline;

  gap:8px;

  flex-wrap:wrap;
}

.price-old{
  font-size:12px;

  color:var(--text-secondary-dark);

  text-decoration:line-through;
}

.price-new{
  font-size:15px;

  font-weight:800;

  color:#fff;
}

body.light .price-new{
  color:#111;
}


/* =========================
   STEAM USD / TRY
========================= */

.currency-note{
  margin-top:4px;

  font-size:11px;

  line-height:1.4;

  color:var(--text-secondary-dark);
}

.currency-note .try{
  color:var(--yellow);

  font-weight:700;
}

body.light .currency-note .try{
  color:#8a7100;
}

.rate-note{
  margin-top:2px;

  font-size:9px;

  color:var(--text-secondary-dark);

  opacity:.75;
}


/* =========================
   PLATFORM
========================= */

.platform-tag{
  display:inline-block;

  margin-top:8px;

  font-size:10px;

  letter-spacing:.4px;

  text-transform:uppercase;

  background:#ffffff10;

  padding:3px 7px;

  border-radius:4px;

  color:var(--text-secondary-dark);
}


/* =========================
   FOOTER
========================= */

.footer-note{
  text-align:center;

  padding:30px 20px 10px;

  font-size:11px;

  color:var(--text-secondary-dark);
}


/* =========================
   ERROR
========================= */

.error-msg{
  max-width:600px;

  margin:30px auto;

  padding:20px;

  border:1px solid #553333;

  background:#1a1010;

  border-radius:10px;

  color:#ffb3b3;

  text-align:center;

  font-size:14px;

  line-height:1.6;
}

</style>
</head>


<body>


<header>

  <div class="logo-wrap">

    <svg
      class="logo-icon"
      viewBox="0 0 64 64"
      xmlns="http://www.w3.org/2000/svg"
    >

      <defs>

        <radialGradient
          id="coinGrad"
          cx="35%"
          cy="30%"
          r="75%"
        >

          <stop
            offset="0%"
            stop-color="#FFF6C4"
          />

          <stop
            offset="45%"
            stop-color="#FFD400"
          />

          <stop
            offset="100%"
            stop-color="#A87F00"
          />

        </radialGradient>

      </defs>


      <circle
        cx="32"
        cy="32"
        r="27"
        fill="url(#coinGrad)"
        stroke="#8A6A00"
        stroke-width="2"
      />


      <circle
        cx="32"
        cy="32"
        r="20"
        fill="none"
        stroke="#8A6A00"
        stroke-width="1.5"
        opacity=".6"
      />


      <path
        d="M32 20 L36 29 L46 30 L38.5 36.5 L41 46 L32 40.5 L23 46 L25.5 36.5 L18 30 L28 29 Z"
        fill="#8A6A00"
        opacity=".85"
      />

    </svg>


    <span class="logo-text">
      GANİMET
    </span>

  </div>


  <div
    class="mode-toggle"
    id="modeToggle"
  >
    ☀️ / 🌙
  </div>

</header>



<main>

  <div
    id="statusMsg"
    class="status-msg"
  >
    İndirimler yükleniyor...
  </div>


  <div
    class="grid"
    id="grid"
  ></div>

</main>



<div class="footer-note">

  Steam fiyatları USD olarak alınır.
  TL karşılığı güncel USD/TRY kuru ile hesaplanır.

</div>



<script>


/* =====================================================
   ELEMENTLER
===================================================== */

const grid =
  document.getElementById('grid');

const statusMsg =
  document.getElementById('statusMsg');


/* =====================================================
   USD / TRY KURU
===================================================== */

let usdTryRate = null;


/*
  Kur bilgisini kendi API'mizden alıyoruz.

  Burada kur yazmıyoruz.

  Sistem:
  /api/exchange-rate

  endpoint'ine gider ve
  rate değerini kullanır.
*/

async function loadExchangeRate(){

  try{

    const response =
      await fetch(
        '/api/exchange-rate',
        {
          cache:'no-store'
        }
      );


    if(!response.ok){

      throw new Error(
        'Kur API HTTP ' +
        response.status
      );

    }


    const data =
      await response.json();


    const rate =
      Number(data?.rate);


    if(
      !Number.isFinite(rate) ||
      rate <= 0
    ){

      throw new Error(
        'Geçersiz USD/TRY kuru'
      );

    }


    usdTryRate = rate;


    console.log(
      'Ganimet USD/TRY kuru:',
      usdTryRate
    );


    return usdTryRate;


  }catch(error){

    console.error(
      'USD/TRY kur hatası:',
      error
    );


    usdTryRate = null;


    return null;

  }

}


/* =====================================================
   FİYAT FORMAT
===================================================== */

function formatNumber(value){

  const num =
    Number(value);


  if(!Number.isFinite(num)){

    return '-';

  }


  if(num === 0){

    return 'Ücretsiz';

  }


  return num.toFixed(2);

}


/*
  Normal mağazalar için fiyat.

  Örneğin:

  149.99 TRY
*/

function formatPrice(
  amount,
  currency
){

  const num =
    Number(amount);


  if(!Number.isFinite(num)){

    return '-';

  }


  if(num === 0){

    return 'Ücretsiz';

  }


  return (
    num.toFixed(2) +
    ' ' +
    (currency || '')
  );

}


/* =====================================================
   STEAM KONTROL
===================================================== */

function isSteamGame(game){

  /*
    Steam'in mevcut shopId'si:
    61

    Öncelikle bunu kullanıyoruz.
  */

  if(
    Number(game?.shopId) === 61
  ){

    return true;

  }


  /*
    Güvenlik için shop adına da bakıyoruz.
  */

  const shop =
    String(
      game?.shop ||
      ''
    ).toLowerCase();


  return shop === 'steam';

}


/* =====================================================
   STEAM USD FİYATI
===================================================== */

function getSteamUsdPrice(game){

  /*
    Eğer backend zaten usdPrice
    gönderiyorsa onu kullan.
  */

  if(
    game?.usdPrice !== undefined &&
    game?.usdPrice !== null
  ){

    const usd =
      Number(game.usdPrice);


    if(
      Number.isFinite(usd)
    ){

      return usd;

    }

  }


  /*
    Yoksa game.price USD ise
    game.price değerini kullan.
  */

  const currency =
    String(
      game?.currency ||
      ''
    ).toUpperCase();


  if(
    currency === 'USD'
  ){

    const usd =
      Number(game.price);


    if(
      Number.isFinite(usd)
    ){

      return usd;

    }

  }


  return null;

}


/* =====================================================
   HTML GÜVENLİĞİ
===================================================== */

function escapeHtml(value){

  return String(
    value ?? ''
  )
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );

}


/* =====================================================
   İNDİRİM
===================================================== */

function formatDiscount(cut){

  const num =
    Number(cut);


  if(
    !Number.isFinite(num)
  ){

    return 0;

  }


  return Math.round(num);

}


/* =====================================================
   STEAM KUR KARŞILIĞI
===================================================== */

function calculateTry(
  usd
){

  const price =
    Number(usd);


  if(
    !Number.isFinite(price)
  ){

    return null;

  }


  if(
    !Number.isFinite(usdTryRate)
  ){

    return null;

  }


  return (
    price *
    usdTryRate
  );

}


/* =====================================================
   STEAM KUR NOTU
===================================================== */

function createSteamCurrencyBlock(
  game
){

  if(
    !isSteamGame(game)
  ){

    return '';

  }


  const usd =
    getSteamUsdPrice(game);


  if(
    !Number.isFinite(usd)
  ){

    return '';

  }


  const tryPrice =
    calculateTry(usd);


  let tryText =
    '';


  if(
    Number.isFinite(tryPrice)
  ){

    tryText =
      `
        <div class="currency-note">
          ≈
          <span class="try">
            ${tryPrice.toFixed(2)} TL
          </span>
        </div>
      `;

  }else{

    tryText =
      `
        <div class="currency-note">
          TL karşılığı alınamadı
        </div>
      `;

  }


  let rateText =
    '';


  if(
    Number.isFinite(usdTryRate)
  ){

    rateText =
      `
        <div class="rate-note">
          1 USD = ${usdTryRate.toFixed(4)} TL
        </div>
      `;

  }


  return `
    ${tryText}
    ${rateText}
  `;

}


/* =====================================================
   OYUNLARI API'DEN AL
===================================================== */

async function loadGames(){

  try{

    const response =
      await fetch(
        '/api/deals',
        {
          cache:'no-store'
        }
      );


    if(!response.ok){

      throw new Error(
        'API isteği başarısız: ' +
        response.status
      );

    }


    const data =
      await response.json();


    console.log(
      'Ganimet API verisi:',
      data
    );


    return (
      Array.isArray(data?.games)
        ? data.games
        : []
    );


  }catch(error){

    console.error(
      'Ganimet veri hatası:',
      error
    );


    return null;

  }

}


/* =====================================================
   OYUN KARTI
===================================================== */

function createGameCard(game){

  const card =
    document.createElement('a');


  card.className =
    'card';


  card.href =
    game.url || '#';


  card.target =
    '_blank';


  card.rel =
    'noopener noreferrer';


  const discount =
    formatDiscount(
      game.cut
    );


  /*
    GÖRSEL
  */

  let imageHtml =
    '';


  if(game.image){

    imageHtml =
      `
        <img
          src="${escapeHtml(game.image)}"
          alt="${escapeHtml(
            game.name ||
            'Oyun'
          )}"
          loading="lazy"
          onerror="
            this.style.display='none'
          "
        >
      `;

  }else{

    imageHtml =
      `
        <span>
          Görsel yok
        </span>
      `;

  }


  /*
    STEAM Mİ?
  */

  const steam =
    isSteamGame(game);


  /*
    FİYATLAR
  */

  let oldPriceHtml =
    '';

  let newPriceHtml =
    '';

  let steamCurrencyHtml =
    '';


  if(steam){

    /*
      STEAM:

      USD gösteriyoruz.

      Örnek:

      49.99 USD
      7.49 USD

      Altında:

      ≈ 273.XX TL
    */

    const usdCurrent =
      getSteamUsdPrice(game);


    let usdOld =
      null;


    /*
      Backend'de usdOldPrice varsa kullan.
    */

    if(
      game?.usdOldPrice !== undefined &&
      game?.usdOldPrice !== null
    ){

      usdOld =
        Number(
          game.usdOldPrice
        );

    }


    /*
      Yoksa oldPrice USD kabul edilebilir.
    */

    if(
      !Number.isFinite(usdOld)
    ){

      const currency =
        String(
          game?.currency ||
          ''
        ).toUpperCase();


      if(
        currency === 'USD'
      ){

        usdOld =
          Number(
            game.oldPrice
          );

      }

    }


    if(
      Number.isFinite(usdOld)
    ){

      oldPriceHtml =
        `
          <span class="price-old">
            ${usdOld.toFixed(2)} USD
          </span>
        `;

    }


    if(
      Number.isFinite(usdCurrent)
    ){

      newPriceHtml =
        `
          <span class="price-new">
            ${usdCurrent.toFixed(2)} USD
          </span>
        `;

    }else{

      newPriceHtml =
        `
          <span class="price-new">
            -
          </span>
        `;

    }


    steamCurrencyHtml =
      createSteamCurrencyBlock(
        game
      );

  }else{

    /*
      DİĞER MAĞAZALAR:

      Mevcut sistem ne gönderiyorsa
      aynen onu göster.

      Steam dışına dokunmuyoruz.
    */

    oldPriceHtml =
      `
        <span class="price-old">
          ${formatPrice(
            game.oldPrice,
            game.currency
          )}
        </span>
      `;


    newPriceHtml =
      `
        <span class="price-new">
          ${formatPrice(
            game.price,
            game.currency
          )}
        </span>
      `;

  }


  /*
    KART HTML
  */

  card.innerHTML =
    `
      <div class="card-img">

        <span class="discount-badge">
          -${discount}%
        </span>


        <div class="hover-info">
          ${escapeHtml(
            game.shop ||
            'Mağaza'
          )}
          'da indirimde
        </div>


        ${imageHtml}

      </div>


      <div class="card-body">

        <div class="game-name">
          ${escapeHtml(
            game.name ||
            'İsimsiz oyun'
          )}
        </div>


        <div class="price-row">

          ${oldPriceHtml}

          ${newPriceHtml}

        </div>


        ${steamCurrencyHtml}


        <span class="platform-tag">
          ${escapeHtml(
            game.shop ||
            'Mağaza'
          )}
        </span>

      </div>
    `;


  return card;

}


/* =====================================================
   ANA SİSTEM
===================================================== */

async function initialize(){

  /*
    Önce iki veriyi aynı anda istiyoruz:

    1. Oyunlar
    2. USD/TRY kuru
  */

  const [
    games,
    exchangeRate
  ] =
    await Promise.all([
      loadGames(),
      loadExchangeRate()
    ]);


  /*
    Kur gelmediyse Steam yine çalışır.

    Sadece TL karşılığı yerine
    "TL karşılığı alınamadı" yazar.

    Diğer mağazalar normal çalışmaya
    devam eder.
  */

  if(
    exchangeRate === null
  ){

    console.warn(
      'USD/TRY kuru alınamadı. Steam TL karşılığı gösterilemeyecek.'
    );

  }


  /*
    API tamamen başarısız.
  */

  if(
    games === null
  ){

    statusMsg.innerHTML =
      `
        <div class="error-msg">

          <strong>
            Veriler yüklenemedi.
          </strong>

          <br>
          <br>

          API bağlantısında bir sorun oluştu.
          Birkaç saniye sonra tekrar deneyebilirsin.

        </div>
      `;

    return;

  }


  /*
    Sadece indirimli oyunlar.
  */

  let filteredGames =
    games.filter(
      game => {

        const discount =
          Number(game.cut);


        return (
          Number.isFinite(discount) &&
          discount > 0
        );

      }
    );


  /*
    Aynı oyunu tekrar gösterme.
  */

  const seenIds =
    new Set();


  filteredGames =
    filteredGames.filter(
      game => {

        const id =
          String(
            game.id ??
            ''
          );


        if(
          id &&
          seenIds.has(id)
        ){

          return false;

        }


        if(id){

          seenIds.add(id);

        }


        return true;

      }
    );


  /*
    Hiç oyun yok.
  */

  if(
    filteredGames.length === 0
  ){

    statusMsg.textContent =
      'Şu anda gösterilecek indirim bulunamadı.';

    return;

  }


  /*
    Yükleniyor mesajını kaldır.
  */

  statusMsg.style.display =
    'none';


  /*
    Eski kartları temizle.
  */

  grid.innerHTML =
    '';


  /*
    Kartları oluştur.
  */

  filteredGames.forEach(
    game => {

      const card =
        createGameCard(game);


      grid.appendChild(
        card
      );

    }
  );


  console.log(
    `Ganimet: ${filteredGames.length} indirim gösteriliyor.`
